<ng-container *ngIf="vm$ | ngrxPush as vm">
  <div class="dialog-header">
    <div class="dialog-icon create-icon">
      <mat-icon>add</mat-icon>
    </div>
    <h2>New Board</h2>
  </div>
  <p class="dialog-desc">Create a new blank board to organize your tasks.</p>

  <form novalidate autocomplete="off" spellcheck="false" [formGroup]="vm.form">
    <mat-form-field>
      <mat-label>Board Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Sprint 43">
    </mat-form-field>

    <div class="actions">
      <button mat-button class="cancel-btn" (click)="vm.cancel()">Cancel</button>
      <button mat-flat-button color="primary" class="save-btn" (click)="vm.save()" [disabled]="vm.form.invalid">Create Board</button>
    </div>
  </form>
</ng-container>
