<div class="top-bar">
  <div class="top-left">
    <h1 class="board-title">{{ board?.name || 'Default Board' }}</h1>
    <p class="board-subtitle">Manage and track your team's tasks</p>
  </div>
  <div class="top-right">
    <div class="filter-group" *ngIf="teamMembers.length > 0">
      <mat-icon class="filter-icon">filter_list</mat-icon>
      <select class="filter-select" [(ngModel)]="selectedTeamMemberId" (ngModelChange)="handleFilterChange()">
        <option [ngValue]="null">All Members</option>
        <option [ngValue]="'unassigned'">Unassigned</option>
        <option [ngValue]="member.teamMemberId" *ngFor="let member of teamMembers">{{ member.name }}</option>
      </select>
    </div>
    <button mat-stroked-button class="board-btn" (click)="handleSelectBoardClick()">
      <mat-icon>dashboard</mat-icon>
      Switch Board
    </button>
    <button mat-stroked-button class="board-btn" [matMenuTriggerFor]="boardMenu">
      <mat-icon>more_vert</mat-icon>
      Board
    </button>
    <mat-menu #boardMenu="matMenu">
      <button mat-menu-item (click)="handleCreateBoardClick()">
        <mat-icon>add</mat-icon>
        <span>New Board</span>
      </button>
      <button mat-menu-item (click)="handleCloneBoardClick()">
        <mat-icon>content_copy</mat-icon>
        <span>Clone Board</span>
      </button>
    </mat-menu>
    <button mat-flat-button color="primary" class="add-btn" (click)="handleClick()">
      <mat-icon>add</mat-icon>
      New Ticket
    </button>
  </div>
</div>
