# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: clarity
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./src/Clarity.Api
    host: containerapp
    language: csharp
    resourceName: ${AZURE_CONTAINER_APP_NAME}
    docker:
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
hooks:
  predeploy:
    shell: sh
    run: |
      echo "Building Angular frontend..."
      cd src/Clarity.Web && npm ci && npx ng build @api && npx ng build @components && npx ng build clarity --configuration production
      echo "Copying frontend to API wwwroot..."
      rm -rf ../Clarity.Api/wwwroot
      mkdir -p ../Clarity.Api/wwwroot
      cp -r dist/clarity/* ../Clarity.Api/wwwroot/
      echo "Frontend build complete. Files copied to wwwroot."
