<ng-container *ngIf="vm$ | ngrxPush as vm">
  <div class="dialog-header">
    <h2 class="dialog-title">Delete Column</h2>
    <button class="close-btn" (click)="vm.cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body">
    <div class="warning-icon">
      <mat-icon>view_column</mat-icon>
    </div>
    <h3 class="confirm-title">Delete "{{ vm.stateName }}" column?</h3>
    <p class="confirm-desc">
      This column contains {{ vm.ticketCount }} ticket{{ vm.ticketCount !== 1 ? 's' : '' }}. Deleting it will remove the column and unassign all tickets from this state.
    </p>
  </div>

  <div class="dialog-actions">
    <button class="cancel-btn" (click)="vm.cancel()">Cancel</button>
    <button class="delete-btn" (click)="vm.confirmDelete()">
      <mat-icon>delete</mat-icon>
      Delete Column
    </button>
  </div>
</ng-container>
