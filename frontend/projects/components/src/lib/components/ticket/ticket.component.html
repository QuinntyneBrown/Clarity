<mat-card class="ticket-card" appearance="outlined" (click)="handleEditClick()">
  <mat-card-content>
    <div class="ticket-header">
      <span class="ticket-title">{{ ticket.name }}</span>
      <span class="ticket-badge" [ngClass]="badgeClass">{{ badgeLabel }}</span>
    </div>
    <p class="ticket-description" *ngIf="ticket.description">{{ ticket.description }}</p>
    <div class="ticket-footer">
      <div class="ticket-assignee" *ngIf="ticket.teamMemberName">
        <div class="assignee-avatar">
          <span>{{ assigneeInitials }}</span>
        </div>
        <span class="assignee-name">{{ assigneeName }}</span>
      </div>
      <div class="ticket-assignee unassigned" *ngIf="!ticket.teamMemberName">
        <div class="assignee-avatar unassigned-avatar">
          <span>?</span>
        </div>
        <span class="assignee-name">Unassigned</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
